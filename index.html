<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReTro Forum</title>

  <!-- Tailwind and daisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- custom css -->
  <link rel="stylesheet" href="styles/custom.css" />
</head>

<body class="mulish">
  <header class="lg:px-20 px-3">
    <!-- navbar -->
    <nav>
      <div class="navbar">
        <div class="navbar-start">
          <a class="btn btn-ghost lg:text-3xl text-xl text-[#12132D] font-extrabold">ReTro</a>
        </div>
        <div class="navbar-end gap-6">
          <div class="space-x-3 hidden lg:block">
            <a class="btn btn-circle tooltip tooltip-bottom" data-tip="Home"><img class="w-4 h-4"
                src="images/Vector.png" alt=""></a>
            <a class="btn btn-circle tooltip tooltip-bottom" data-tip="Edit"><img class="w-4 h-4"
                src="images/Vector (1).png" alt=""></a>
            <a class="btn btn-circle tooltip tooltip-bottom" data-tip="User"><img class="w-4 h-4"
                src="images/Vector (2).png" alt=""></a>
            <a class="btn btn-circle tooltip tooltip-bottom" data-tip="Report"><img class="w-4 h-4"
                src="images/Vector (3).png" alt=""></a>
          </div>
          <div>
            <a class="btn font-bold lg:text-lg text-xs bg-[#797DFC] text-white rounded-full">Sign In</a>
          </div>
        </div>
    </nav>

    <!-- banner section -->
    <section class="container mx-auto lg:mt-5">
      <div
        class="hero lg:h-[550px] bg-cover bg-[#12132D] rounded-3xl flex lg:flex-row flex-col justify-between gap-4 lg:p-20 p-6"
        style="background-image: url(images/bgbanner.png);">
        <div class="lg:space-y-8 space-y-3 lg:w-[60%] w-full ">
          <h2 class="text-white lg:text-6xl text-2xl font-extrabold leading-tight">
            Welcome to the
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#797DFC] to-transparent">
              ReTro
            </span>
            Forum
          </h2>
          <p class="text-white lg:text-lg text-xs font-medium">
            Share your favorite opinion and win and wp forum coffee mug!
          </p>
          <div class="bg-white rounded-full max-w-md flex pr-3">
            <input type="text" id="search-input" placeholder="Search here anything"
              class="lg:text-base text-xs py-3 pl-5 outline-none rounded-full flex-1 border-none">
            <button id="search-btn"
              class="text-white lg:text-base text-xs bg-[#797DFC] rounded-full px-5 my-1">Search</button>
          </div>
        </div>
        <div
          class="bg-white lg:text-xl text-base font-medium text-[#12132Dcc] flex justify-between lg:p-8 p-4 gap-8 rounded-3xl">
          <div class="lg:space-y-5 space-y-2">
            <p>Registered Users</p>
            <p>Forum</p>
            <p>Topics</p>
            <p>Replies</p>
          </div>
          <div class="lg:space-y-5 space-y-2">
            <p>01</p>
            <p>05</p>
            <p>01</p>
            <p>01</p>
          </div>
        </div>
      </div>
    </section>
  </header>
  <main class="container mx-auto lg:px-20 px-3 lg:my-20 my-10">
    
  </main>
  <footer></footer>

  <!-- script -->
  <script src="script/retro.js"></script>
</body>

</html>
